name: Diagnostic application

on:
  push:
    branches: [codex/portable-diagnostics]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml/pyproject.toml
            requirements-dev.txt
      - name: Install diagnostic dependencies
        run: python -m pip install ./ml -r requirements-dev.txt
      - name: Verify clean-checkout application
        env:
          PYTHONPATH: ml:cmd/thesis_demo
        run: python -m unittest discover -s cmd/thesis_demo -p 'test_*.py' -v
      - name: Bounded research input contracts, no corpus or model fitting
        env:
          PYTHONPATH: ml:scripts
        run: python -m unittest test_r3_dependency_overlap test_r3_red_reserve test_r3_red test_r3_metric_contract -q

  product-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU-only product without experiment corpus
        run: docker build -f deploy/product/Dockerfile -t rca-product:ci .
      - name: Validate runtime Compose limits
        run: |
          RCA_PROFILES_DIR="$GITHUB_WORKSPACE/deploy/profiles" docker compose -f deploy/product/compose.yml config --format json \
            | python -c 'import json,sys; s=json.load(sys.stdin)["services"]["diagnostic"]; assert s["tmpfs"] == ["/tmp:rw,nosuid,size=64m"]; assert s["read_only"] is True'
      - name: Compare installed CPU runtime with public sealed reference
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=64m \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/reference,readonly \
            --mount type=bind,src="$GITHUB_WORKSPACE/scripts/verify_portable_runtime.py",dst=/verify.py,readonly \
            rca-product:ci python /verify.py --root /opt/rca \
            --reference-root /reference --minimum-cases 1

  assistant-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional assistant and test dependencies
        # Keep historical research pins intact. This job tests the current
        # optional runtime, whose requests pin differs from the training env.
        # pandas/pyarrow/tqdm are only for read-only research regression imports.
        run: python -m pip install -r deploy/product/requirements.txt -r requirements-dev.txt -r deploy/product/requirements-assistant.txt pandas==3.0.2 pyarrow==24.0.0 tqdm==4.65.0
      - name: Validate local assistant security and lifecycle without provider calls
        env:
          PYTHONPATH: ml:cmd/thesis_demo
        run: python -m unittest discover -s cmd/thesis_demo -p 'test_*.py' -q
      - name: Workspace restoration validation regression
        run: node --test cmd/thesis_demo/test_*.mjs
      - name: Build explicit optional runtime composition
        run: docker build --target assistant -f deploy/product/Dockerfile -t rca-assistant:ci .
      - name: Verify absent research corpus and credentials inside image
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=64m rca-assistant:ci \
            python -c 'from pathlib import Path; import sys; sys.path.insert(0,"cmd/thesis_demo"); import workspace_store,assistant_worker; assert not Path("external-data").exists(); assert not Path("ml/models/m14").exists(); assert not Path(".rca-private").exists()'

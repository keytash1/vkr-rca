services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started

  payment:
    build:
      context: .
      args:
        SERVICE: payment
    environment:
      HTTP_ADDR: ":8082"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "${PAYMENT_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8082/health"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s
    depends_on:
      otel-collector:
        condition: service_started

  orders:
    build:
      context: .
      args:
        SERVICE: orders
    environment:
      HTTP_ADDR: ":8081"
      HTTP_CLIENT_TIMEOUT: "2s"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      PAYMENT_URL: "http://payment:8082"
    ports:
      - "${ORDERS_PORT:-8081}:8081"
    depends_on:
      payment:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8081/health"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      HTTP_ADDR: ":8080"
      HTTP_CLIENT_TIMEOUT: "3s"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      ORDERS_URL: "http://orders:8081"
    ports:
      - "${GATEWAY_PORT:-18080}:8080"
    depends_on:
      orders:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s

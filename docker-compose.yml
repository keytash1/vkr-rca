services:
  payment:
    build:
      context: .
      args:
        SERVICE: payment
    environment:
      HTTP_ADDR: ":8082"
    ports:
      - "${PAYMENT_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8082/health"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s

  orders:
    build:
      context: .
      args:
        SERVICE: orders
    environment:
      HTTP_ADDR: ":8081"
      HTTP_CLIENT_TIMEOUT: "2s"
      PAYMENT_URL: "http://payment:8082"
    ports:
      - "${ORDERS_PORT:-8081}:8081"
    depends_on:
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8081/health"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      HTTP_ADDR: ":8080"
      HTTP_CLIENT_TIMEOUT: "3s"
      ORDERS_URL: "http://orders:8081"
    ports:
      - "${GATEWAY_PORT:-18080}:8080"
    depends_on:
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s

global:
  scrape_interval: 2s
  evaluation_interval: 2s
scrape_configs:
  - job_name: resource-observations
    static_configs: [{targets: ["metrics-exporter:9100"]}]
  - job_name: request-workload
    static_configs: [{targets: ["workload:9101"]}]
  - job_name: business-http-red
    static_configs:
      - targets: ["gateway:8080", "orders:8081", "payment:8082"]

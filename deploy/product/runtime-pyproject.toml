[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-diagnostic-runtime"
version = "0.1.0"
description = "Portable read-only service diagnostic ranking runtime"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.4.4",
  "scipy==1.18.1",
  "scikit-learn==1.8.0",
  "xgboost==3.2.0; platform_system != 'Linux'",
  "xgboost-cpu==3.2.0; platform_system == 'Linux'",
  "joblib==1.6.0",
  "threadpoolctl==3.6.0",
  "cloudpickle==3.1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rca_ml*"]

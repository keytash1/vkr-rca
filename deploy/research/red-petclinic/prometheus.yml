global:
  scrape_interval: 2s
  evaluation_interval: 2s
scrape_configs:
  - job_name: resource-observations
    static_configs: [{targets: ["metrics-exporter:9100"]}]
  - job_name: request-workload
    static_configs: [{targets: ["workload:9101"]}]
  - job_name: business-http-red
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: {service: api-gateway}
      - targets: ["customers-service:8081"]
        labels: {service: customers-service}
      - targets: ["visits-service:8082"]
        labels: {service: visits-service}
      - targets: ["vets-service:8083"]
        labels: {service: vets-service}

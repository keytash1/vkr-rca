networks:
  default:
    name: vkr-rca-m14

services:
  ad:
    labels: {io.vkr.m14.role: application}
    ports: !reset []
    build:
      dockerfile: ${M14_ROOT}/deploy/m14/Dockerfile.ad-repro
  cart: {labels: {io.vkr.m14.role: application}, ports: !reset []}
  checkout: {labels: {io.vkr.m14.role: application}, ports: !reset []}
  currency: {labels: {io.vkr.m14.role: application}, ports: !reset []}
  email: {labels: {io.vkr.m14.role: application}, ports: !reset []}
  frontend: {labels: {io.vkr.m14.role: application}, ports: !reset []}
  frontend-proxy:
    labels: {io.vkr.m14.role: application}
    ports: !override ["127.0.0.1:15014:8080", "127.0.0.1:11014:10000"]
  payment: {labels: {io.vkr.m14.role: application}, ports: !reset []}
  product-catalog: {labels: {io.vkr.m14.role: application}, ports: !reset []}
  quote:
    labels: {io.vkr.m14.role: application}
    ports: !reset []
    build:
      dockerfile: ${M14_ROOT}/deploy/m14/Dockerfile.quote-repro
  recommendation: {labels: {io.vkr.m14.role: application}, ports: !reset []}
  shipping: {labels: {io.vkr.m14.role: application}, ports: !reset []}

  astronomy-db:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512M
  valkey-cart: {ports: !reset []}
  flagd: {ports: !reset []}

  load-generator:
    ports: !reset []
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    build: !reset null
    command: ["sleep", "infinity"]
    environment:
      LOCUST_AUTOSTART: "false"
      LOCUST_BROWSER_TRAFFIC_ENABLED: "false"

  image-provider:
    ports: !reset []
    image: ghcr.io/open-telemetry/demo:3.0.0-image-provider@sha256:93e1585e97ac3de0e2ace6929dc5e2a797e2c009fbb3eba668fa3990f4f271b5
    build: !reset null

  flagd-ui:
    ports: !reset []
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    build: !reset null
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "true"]

  telemetry-docs:
    ports: !reset []
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    build: !reset null
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "true"]

  otel-collector:
    ports: !reset []
    command:
      - "--config=/etc/otelcol-config.yml"
      - "--config=/etc/m14-otelcol-config.yml"
      - "--feature-gates=service.profilesSupport"
    volumes:
      - ${M14_ROOT}/deploy/m14/otelcol-config.yml:/etc/m14-otelcol-config.yml:ro
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "100000"
    ports: ["127.0.0.1:16689:16686"]
    restart: unless-stopped

  metrics-exporter:
    image: vkr-rca-m14/metrics-exporter:v1
    build:
      context: ${M14_ROOT}/deploy/m14
      dockerfile: Dockerfile.exporter
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ${M14_ROOT}/deploy/m14/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:19092:9090"]
    depends_on: [metrics-exporter]
    restart: unless-stopped

  fault-tool:
    image: vkr-rca-m14/fault-tool:v1
    build:
      context: ${M14_ROOT}/deploy/m14
      dockerfile: Dockerfile.fault-tool
    profiles: [tools]
